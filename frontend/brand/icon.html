<!doctype html>
<!-- Source for the PNG app icons. The mark from public/favicon.svg, filling the viewport. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #141413; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <!-- Square corners: iOS and Android apply their own mask. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect width="32" height="32" fill="#141413"/>
    <path d="M9.5 9.5 L20 15.5 L11 22.5" fill="none" stroke="#fdfdfc" stroke-width="2.1"
          stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
    <circle cx="9.5" cy="9.5" r="3.1" fill="#fdfdfc"/>
    <circle cx="21.5" cy="16" r="3.1" fill="#8f8ff0"/>
    <circle cx="11" cy="22.8" r="3.1" fill="#fdfdfc"/>
  </svg>
</body>
</html>
