<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Napkin Chain — build systems on a napkin</title>
    <meta
      name="description"
      content="Train the system-design estimation reflex. Size real systems one connected estimate at a time, scored on order of magnitude, not arithmetic."
    />
    <meta name="theme-color" content="#fdfdfc" />
    <link rel="canonical" href="https://napkinchain.leadbybuild.ing/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#141413" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews: WhatsApp, LinkedIn, Slack, iMessage, Facebook. Absolute URLs only. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Napkin Chain" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://napkinchain.leadbybuild.ing/" />
    <meta property="og:title" content="Napkin Chain — build systems on a napkin" />
    <meta
      property="og:description"
      content="Most engineers can draw the boxes. Far fewer can size them. Drill system-design estimation on real systems, one connected estimate at a time."
    />
    <meta property="og:image" content="https://napkinchain.leadbybuild.ing/og-image.png" />
    <meta property="og:image:secure_url" content="https://napkinchain.leadbybuild.ing/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Napkin Chain: build systems on a napkin. A chain of estimates from 100M daily users to peak QPS."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Napkin Chain — build systems on a napkin" />
    <meta
      name="twitter:description"
      content="Drill system-design estimation on real systems, scored on order of magnitude."
    />
    <meta name="twitter:image" content="https://napkinchain.leadbybuild.ing/og-image.png" />
    <meta name="twitter:image:alt" content="A chain of estimates from 100M daily users to peak QPS." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Napkin Chain",
        "url": "https://napkinchain.leadbybuild.ing/",
        "description": "A system-design estimation trainer: size real systems as a chain of connected estimates, scored on order of magnitude.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "image": "https://napkinchain.leadbybuild.ing/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .boot { min-height: 100dvh; display: grid; place-items: center; background: #fdfdfc; }
      .boot span {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid #d5d4ce; border-top-color: #141413;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <!-- Shown until React mounts and replaces it, so a slow first load is never a blank page. -->
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Napkin Chain"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
