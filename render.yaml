# Render Blueprint: one web service serving both the API and the built SPA.
#
# Single service on purpose. Splitting the frontend onto its own *.onrender.com
# subdomain would make the session cookie third-party, which Safari blocks
# outright. One origin keeps sign-in working everywhere.
services:
  - type: web
    name: napkin-chain
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health

    buildCommand: ./render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: NODE_VERSION
        value: '22'
      - key: ENVIRONMENT
        value: production

      # The API serves the SPA, so both URLs are this service's own.
      # RENDER_EXTERNAL_URL is injected by Render at runtime.
      - key: SERVE_FRONTEND
        value: 'true'

      # Generated by Render and never seen by anyone. Rotating it signs
      # everybody out, which is the intended behaviour.
      - key: SESSION_SECRET
        generateValue: true

      - key: MONGODB_DB
        value: napkin_chain
      - key: LOG_LEVEL
        value: INFO

      # Prompted for at deploy time, stored encrypted, never in the repo.
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
