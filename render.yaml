# Render Blueprint: one web service serving both the API and the built SPA.
#
# Single service on purpose. Splitting the frontend onto its own *.onrender.com
# subdomain would make the session cookie third-party, which Safari blocks
# outright. One origin keeps sign-in working everywhere.
services:
  - type: web
    name: napkin-chain
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Closest region to the author and early users, who are on IST.
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      # SERVE_FRONTEND and FRONTEND_DIST are set in the image. Both public
      # URLs come from RENDER_EXTERNAL_URL, which Render injects at runtime.

      # Generated by Render and never seen by anyone. Rotating it signs
      # everybody out, which is the intended behaviour.
      - key: SESSION_SECRET
        generateValue: true

      - key: MONGODB_DB
        value: napkin_chain
      - key: LOG_LEVEL
        value: INFO

      # Prompted for at deploy time, stored encrypted, never in the repo.
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
